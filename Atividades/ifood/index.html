<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ifood - Delivery de comida</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Teko:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Utilizando uma tag semantica para criar o cabecalho -->
     <header class="cabecalho">
        <div class="container">
            <img src="https://logopng.com.br/logos/ifood-43.png"  class="logo">
            <!-- Utilizando um nav, para adicionar os menus navegação -->
            <nav class="navegacao">
                <a href="#" class="item">Restaurante</a>
                <a href="#" class="item">Mercado</a>
                <a href="#" class="item">Bebidas</a>
                <a href="#" class="item">Farmácia</a>
                <a href="#" class="item">Pet-shop</a>
            </nav>
            <div>
                <input type="text" placeholder="Busque por item ou loja" class="buscar">
                <div class="localizacao">
                    <span>📍</span>
                    <input type="text" value="Andradina SP" class="texto-local">
                </div>
            </div>
            <div class="acao">
                <a href="#" class="criar-conta">Criar Conta</a>
                <button class="botao-entrar">Entrar</button>
            </div>
        </div>
     </header>
     <main>
         <section class="coluna">
            <!-- Seção de Produtos -->
             <!-- card de produtos -->
              <div class="card-produtos">
                <img src="https://static.vecteezy.com/system/resources/previews/016/765/986/non_2x/steak-fast-food-cartoon-png.png" alt="">
                <p>Almoço</p>
              </div>
              <div class="card-produtos">
                <img src="https://png.pngtree.com/png-clipart/20220306/original/pngtree-red-shapes-promotion-banner-png-image_7420664.png" alt="">
                <p>Promoção</p>
              </div>
              <div class="card-produtos">
                <img src="https://png.pngtree.com/png-vector/20240909/ourmid/pngtree-a-reusable-grocery-bag-packed-with-produce-cans-and-other-essentials-png-image_13799219.png" alt="">
                <p>Mercado</p>
              </div>
              <div class="card-produtos">
                <img src="https://png.pngtree.com/png-clipart/20230913/original/pngtree-booze-clipart-alcoholic-drinks-and-fruit-on-a-white-background-vector-png-image_11060086.png" alt="">
                <p>Bebidas</p>
              </div>
              <div class="card-produtos">
                <img src="https://png.pngtree.com/png-clipart/20230913/original/pngtree-packed-lunch-vector-png-image_11058741.png" alt="">
                <p>Marmita</p>
              </div>
              <div class="card-produtos">
                <img src="https://images.vexels.com/media/users/3/230796/isolated/preview/28fd4675876fbf3f580ab5b0a9785449-desenho-de-fatia-de-pizza-feliz.png" alt="">
                <p>Pizza</p>
              </div>
         </section>
         <section>
            <!-- Seçao de Lojas -->
         </section>
         <section>
            <!-- Seçao de promoções -->
         </section>
     </main>
</body>
</html>
