<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoria JavaScript</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full">
        <h1 class="text-3x1 font-bold text-gray-800 mb-6 text-center">Teoria JavaScript</h1>
        <div class="space-y-6">
        <div class="flex flex-col sm:flex-row gap-4">
            <button onclick="BotaoTeste()" class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200 ease-in-out">Clique aqui</button>
              <button onclick="BotaoNome()" class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200 ease-in-out">Qual seu nome?</button>
        </div>
        <div class="space-y-3 mt-4">
            <button onclick="somar()" class="w-full bg-green-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-600 transition duration-200 ease-in-out">Somando numeros</button>
            <p id="resultado" class="bg-gray-100 p-4 rounded-md text-gray-700 min-h-[50px] border border-gray-200">Aqui exibiremos nosso resultado</p>
        </div>
   </div>
   <div class="space-y-3 mt-4">
    <input type="text" id="input-cidade" placeholder="Digite o nome de uma cidade" 
    class="w-full border border-gray-300 p-2 rounded-lg
    focus:outline-none focus:ring-2 focus:ring-purple-500
    transition">
    <button onclick="cidade()"class="w-full bg-purple-500 text-wrap font-semibold py-2 px-4 rounded-lg
     hover:bg-purple-600 transition duration-200 ease-in-out">Validar Cidade</button>
 <p id="resultadoCidade" class="bg-gray-100 p-4 rounded-md text-gray-700 min-h-[50px] border border-gray-200"></p>
   </div>
</div>
    <script>
        //Codigo javascript
        //Exibir no console, sem mostrar na página
        console.log('Testando JS WEB')
        //Tipos diferentes de mensagens no console
        console.error("Esta é uma mensagem de erro!")
        console.warn("É uma mensagem de alerta!")
        CONSOLE.info("Está é uma mensagem de informação.")

        //alerta utilizando o pop-up

        //alert("Bem-vindo!");

        function BotaoTeste(){
            alert("Botão Clicado!");
        }

        function BotaoNome(){
            var nome = prompt('Qual seu nome?');
            confirm(`Olá, ${nome}, entendeu Js?`)
        }
        function somar(){
            var n1 = Number(prompt('Digite um valor:'));
            var n2 = Number(prompt('Digite um numero:'));

//Busca o elemento pelo ID e a altera o conteudo HTML dele
            document.getElementById("resultado").innerHTML +=
            `<br> A soma dos numeros ${n1} + ${n2} = ${n1 + n2}`
        }

    function cidade(){
        //armazenar o valor na variavel, buscando o valor do input

        var nomeCidade = document.getElementById("input-cidade").value 
        document.getElementById("resultadoCidade").innerHTML = nomeCidade
    }
    </script>

</body>
</html>
