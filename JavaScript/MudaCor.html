<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoria JavaScript</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4 gap-4">
    <h1>Alterando cor de fundo</h1>
    <button onclick="btnVermelho()" class="w-50 bg-red-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-600 transition duration-200 ease-in-out">Vermelho</button>
    <button class="w-50 bg-green-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-600 transition duration-200 ease-in-out">Verde</button>
    <button class="w-50 bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200 ease-in-out">Azul</button>
 
    <script>
        function btnVermelho(){
            document.body.style.background = "red"
        }
        function btnVerde(){
            document.body.style.background = "Green"
        }
        function btnAzul(){
            document.body.style.background = "Blue"
        }
    </script>
</body>
</html>
